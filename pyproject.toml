[project]
name = "tracking"
version = "0.3.5"
description = "Insect video tracking pipeline"
requires-python = ">=3.11"

dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "tqdm>=4.66",
]

[project.scripts]
tracker = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

# Non-Python files that must ship with the installed package
[tool.hatch.build.targets.wheel.force-include]
"project_template/project.yaml" = "project_template/project.yaml"
